# SAP SuccessFactors Object Sync — Configuration
# ================================================
# Controls PRD-to-Dev sync of OM foundation objects via OData v2.
# Always run with dry_run: true first to preview payloads.

prd:
  # Production tenant OData v2 base URL (include /odata/v2 suffix)
  base_url: "https://api55.sapsf.eu/odata/v2"
  # API user with read access to all OM foundation objects
  username: "DMAdmin@ikeaitabT3"
  password: "Sep@2025"

dev:
  # Development/lower tenant OData v2 base URL
  base_url: "https://api55.sapsf.eu/odata/v2"
  # API user with read+write access to all OM foundation objects
  username: "DMAdminSahir@ikeaitabD"
  password: "Mar@2026"

options:
  # dry_run: true  → preview only; constructs payloads, prints them, NO writes to Dev
  # dry_run: false → live mode; requires Yes/No confirmation before any write
  # CLI flag --dry-run always forces true, regardless of this setting
  dry_run: false

  # Console + file log level: DEBUG | INFO | WARNING | ERROR
  log_level: "INFO"

  # All output files land here: Excel report, JSONL audit, run log, dry-run summary
  output_dir: "./output"

  # Per-request HTTP timeout in seconds (applied to GET and POST)
  request_timeout_sec: 30

  # Locales are synced dynamically — all non-null locale fields present in the
  # PRD record are included automatically (no fixed list needed).
